# =============================================================================
# Nginx Virtual Host Configuration - Reverse Proxy for Spring Boot
# File: /etc/nginx/sites-available/spring-proxy.conf
# Description: Routes static content and proxies /api/ to Spring Boot :8082
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Root directory for static files
    root /var/www/html;
    index index.html index.htm;

    # ------------------------------------------------------------------
    # Location / — Serve static files directly
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ------------------------------------------------------------------
    # Location /api/ — Reverse Proxy to Spring Boot on port 8082
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8082/;

        # Forward client information to the backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ------------------------------------------------------------------
    # Custom error pages (optional but recommended)
    # ------------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
